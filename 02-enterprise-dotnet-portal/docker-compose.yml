services:
  portal:
    build:
      context: ..
      dockerfile: 02-enterprise-dotnet-portal/Dockerfile
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Password: ${PORTAL_DEMO_PASSWORD:?Set PORTAL_DEMO_PASSWORD}
      Encryption__Key: ${PORTAL_ENCRYPTION_KEY:?Set PORTAL_ENCRYPTION_KEY}
      Demo__DataPath: /tmp/portal/cases.enc
    volumes: ["portal-data:/tmp/portal"]
volumes:
  portal-data:
