trigger: [main]
pool: { vmImage: windows-latest }
variables: { buildConfiguration: Release }
stages:
- stage: Build
  jobs:
  - job: BuildAndTest
    steps:
    - task: DotNetCoreCLI@2
      inputs: { command: build, projects: '**/*.csproj', arguments: '--configuration $(buildConfiguration)' }
    - task: DotNetCoreCLI@2
      inputs: { command: test, projects: '**/*Tests.csproj' }
    - task: DotNetCoreCLI@2
      inputs: { command: publish, arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)' }
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: portal
- stage: Deploy
  dependsOn: Build
  jobs:
  - deployment: DeployStaging
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps: [ { task: AzureWebApp@1, inputs: { package: '$(Pipeline.Workspace)/portal' } } ]
