trigger:
  - main
pool:
  vmImage: ubuntu-latest
steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - script: dotnet build 02-enterprise-dotnet-portal/src/EnterprisePortal.sln -c Release -p:UseSqlServer=true
  - script: dotnet 02-enterprise-dotnet-portal/src/EnterprisePortal.Tests/bin/Release/net10.0/EnterprisePortal.Tests.dll
